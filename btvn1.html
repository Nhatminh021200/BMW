<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTVN1</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
</head>
<body>
    <div class="row mt-5">
        <div class="col col-3"></div>
        <div class="col col-7">
            <form action="" class="w-30 mx-auto">
               <div >
                <label class="form-label fw-bold" for="email">Email</label>
                <input class="form-control" type="email" autofocus name="email" placeholder="admin@gmail.com">
               </div>
               <div>
                <label class="form-label fw-bold" for="Password">Password</label>
                <input class="form-control" type="password" name="Password" placeholder="Password">
               </div>
            </form>
        <div class="col col-2"></div>
        </div>
    </div>
    <div class="row mt-3 mb-5">
        <div class="col col-3"></div>
        <div class="col col-7 d-flex justify-content-between">
            <div class="form-check mt-3">
                <label class="form-check-label" for="Remember">Remember Me</label>
                <input class="form-check-input bg-primary" type="checkbox" name="Remember">
            </div>
            <div class="nav-item">
                <a class="nav-link">Forgot password?</a>
            </div>   
        </div>  
        <div class="col col-5"></div>      
    </div>
    <div class="row">
        <div class="col col-3"></div>
        <div class="col col-7">
            <button class=" btn container-fluid btn-primary rounded-5">LOGIN</button>
        </div>
        <div class="col col-5"></div>
    </div>
    <div class="row">
        <div class="col col-3"></div>
        <div class="col col-7 d-flex justify-content-end">
            <p class="mt-2">Not a member?</p>
            <a class="nav-link">Register</a>
        </div>
        <div class="col col-5"></div>
    </div>
    <div class="row">
        <div class="col col-2"></div>
        <div class="col col-9">
            <div class="d-flex flex-column vh-100">
                <div class="flex-grow-1"> </div>
                <div class="bg-secondary border rounded p-3 d-flex justify-content-end">
                    <button class="btn btn-primary mt-3">Logout</button>
                    <button class="btn btn-secondary btn-outline-dark mt-3 ms-2">Sign up</button>
                    <button class="btn btn-secondary btn-outline-dark mt-3 ms-2">Log in</button>
                </div>
            </div>          
        </div>
        <div class="col col-1"></div>
    </div>
</body>
</html>
